<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess My Favorites! ✨</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFFDF0;
            --card-color: #FFFFFF;
            --accent-yellow: #FFF2A1;
            --hover-yellow: #FFE869;
            --text-main: #5D5745;
            --text-muted: #A39C85;
            --correct-green: #E2F5D3;
            --wrong-red: #FCE2E2;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px #FFF;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .scoreboard {
            background-color: var(--card-color);
            border: 3px solid var(--accent-yellow);
            border-radius: 20px;
            padding: 12px 25px;
            display: inline-flex;
            gap: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 25px;
            box-shadow: 0 8px 0px var(--accent-yellow);
        }

        .card {
            background-color: var(--card-color);
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 10px 20px rgba(93, 87, 69, 0.05);
            border: 3px solid #FFF;
            margin-bottom: 20px;
        }

        .question-num {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.6rem;
            margin: 0 0 25px 0;
            font-weight: 600;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--bg-color);
            border: 2px solid var(--accent-yellow);
            border-radius: 15px;
            padding: 15px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--hover-yellow);
            transform: translateY(-2px);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: var(--correct-green) !important;
            border-color: #BCE59C;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            border-color: #F3B6B6;
        }

        .next-btn {
            background-color: var(--accent-yellow);
            border: 3px solid #FFF;
            border-radius: 20px;
            padding: 12px 35px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 0 5px 0px var(--hover-yellow);
            margin-top: 15px;
            display: none;
        }

        .next-btn:hover {
            background-color: var(--hover-yellow);
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0px var(--hover-yellow);
        }

        .results-screen {
            display: none;
        }

        .restart-btn {
            background-color: var(--accent-yellow);
            border: 3px solid #FFF;
            border-radius: 20px;
            padding: 15px 40px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 0 6px 0px var(--hover-yellow);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>How Well Do You Know Me? 🍳</h1>
        <div class="subtitle">Guess my absolute favorite things!</div>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div>Score: <span id="score">0</span>/<span id="total-score">0</span></div>
            <div>Round: <span id="current-round">1</span>/<span id="total-rounds">0</span></div>
        </div>

        <!-- Quiz Interface -->
        <div id="quiz-screen" class="card">
            <div class="question-num" id="question-header">Question 1</div>
            <div class="question-text" id="question-title">Loading...</div>
            
            <div class="options-grid" id="options-container">
                <!-- Buttons dynamically loaded here -->
            </div>

            <button class="next-btn" id="next-button" onclick="nextQuestion()">Next ✨</button>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="card results-screen">
            <div class="question-text">🎉 Quiz Finished! 🎉</div>
            <div class="question-text" style="font-size: 2.2rem; color: var(--text-muted);" id="final-score-text">0/0</div>
            <p id="feedback-text" style="font-size: 1.2rem; margin-bottom: 25px;">Wow! You are a great friend!</p>
            <button class="restart-btn" onclick="restartQuiz()">Play Again 🔄</button>
        </div>
    </div>

    <script>
        // ✏️ CUSTOMIZE YOUR FAVORITES HERE!
        // Make sure the "correct" text exactly matches one of the options.
        const quizData = [
            {
                question: "What is my absolute favorite color? 🎨",
                options: ["Pastel Pink", "Light Yellow", "Mint Green", "Lavender"],
                correct: "Light Yellow"
            },
            {
                question: "If I could only eat one food forever, what is it? 🍕",
                options: ["Sushi", "Strawberry Cake", "French Fries", "Ramen"],
                correct: "Strawberry Cake"
            },
            {
                question: "What is my favorite animal? 🐾",
                options: ["Fluffy Bunny", "Capybara", "Golden Retriever", "Fat Cat"],
                correct: "Fat Cat"
            },
            {
                question: "What is my favorite hobby? 🧸",
                options: ["Playing Games", "Baking Sweets", "Drawing", "Sleeping"],
                correct: "Baking Sweets"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let hasAnswered = false;

        const questionHeader = document.getElementById("question-header");
        const questionTitle = document.getElementById("question-title");
        const optionsContainer = document.getElementById("options-container");
        const nextButton = document.getElementById("next-button");
        const quizScreen = document.getElementById("quiz-screen");
        const endScreen = document.getElementById("end-screen");
        
        const scoreDisplay = document.getElementById("score");
        const totalScoreDisplay = document.getElementById("total-score");
        const currentRoundDisplay = document.getElementById("current-round");
        const totalRoundsDisplay = document.getElementById("total-rounds");
        const finalScoreText = document.getElementById("final-score-text");
        const feedbackText = document.getElementById("feedback-text");

        // Start the web app
        function initQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            totalScoreDisplay.textContent = quizData.length;
            totalRoundsDisplay.textContent = quizData.length;
            quizScreen.style.display = "block";
            endScreen.style.display = "none";
            loadQuestion();
        }

        // Display current question data
        function loadQuestion() {
            hasAnswered = false;
            nextButton.style.display = "none";
            scoreDisplay.textContent = score;
            currentRoundDisplay.textContent = currentQuestionIndex + 1;
            
            const currentData = quizData[currentQuestionIndex];
            questionHeader.textContent = `Question ${currentQuestionIndex + 1}`;
            questionTitle.textContent = currentData.question;
            
            optionsContainer.innerHTML = "";
            currentData.options.forEach(option => {
                const button = document.createElement("button");
                button.classList.add("option-btn");
                button.textContent = option;
                button.onclick = () => checkAnswer(button, option);
                optionsContainer.appendChild(button);
            });
        }

        // Handle answer selection
        function checkAnswer(selectedButton, selectedOption) {
            if (hasAnswered) return;
            hasAnswered = true;

            const currentData = quizData[currentQuestionIndex];
            const allButtons = optionsContainer.querySelectorAll(".option-btn");

            allButtons.forEach(button => {
                button.disabled = true;
                if (button.textContent === currentData.correct) {
                    button.classList.add("correct");
                }
            });

            if (selectedOption === currentData.correct) {
                score++;
                scoreDisplay.textContent = score;
            } else {
                selectedButton.classList.add("wrong");
            }

            nextButton.style.display = "inline-block";
        }

        // Progress to next screen
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        // Handle score calculations and display messages
        function showEndScreen() {
            quizScreen.style.display = "none";
            endScreen.style.display = "block";
            finalScoreText.textContent = `${score} / ${quizData.length}`;
            
            const percent = (score / quizData.length) * 100;
            if (percent === 100) {
                feedbackText.textContent = "🏅 OMG! You know me perfectly! Bestie status unlocked!";
            } else if (percent >= 50) {
                feedbackText.textContent = "✨ Pretty good! You know me well!";
            } else {
                feedbackText.textContent = "🧁 Close! Time for us to hang out more!";
            }
        }

        function restartQuiz() {
            initQuiz();
        }

        // Trigger on load
        initQuiz();
    </script>
</body>
</html>
